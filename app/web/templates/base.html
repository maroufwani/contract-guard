<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Contract Guard{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        :root { --line: #e3e3e3; --muted: #777777; --link: #1a5fb4; }
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; margin: 0; background: #f7f7f8; color: #1c1c1c; }
        nav { display: flex; gap: 1.25rem; align-items: baseline; padding: 0.75rem 1.5rem; background: #ffffff; border-bottom: 1px solid var(--line); }
        nav .brand { font-weight: 700; color: inherit; text-decoration: none; }
        nav a { color: #555555; text-decoration: none; }
        nav a:hover { color: #1c1c1c; }
        main { max-width: 72rem; margin: 1.5rem auto; padding: 0 1.5rem; }
        h1 { font-size: 1.5rem; margin: 0 0 1rem; }
        h2 { font-size: 1.15rem; margin: 1.75rem 0 0.6rem; }
        a { color: var(--link); }
        table { width: 100%; border-collapse: collapse; background: #ffffff; border: 1px solid var(--line); font-size: 0.9rem; }
        th, td { padding: 0.45rem 0.6rem; text-align: left; border-bottom: 1px solid #eeeeee; vertical-align: top; }
        th { background: #f3f4f6; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; color: #555555; }
        .table-wrap { overflow-x: auto; }
        .muted { color: var(--muted); }
        .badge { display: inline-block; padding: 0.05rem 0.45rem; border-radius: 0.35rem; font-size: 0.78rem; font-weight: 600; background: #eeeeee; color: #333333; }
        .badge.breaking, .badge.blocked, .badge.error { background: #fde2e1; color: #9b1c1c; }
        .badge.warning { background: #fdf0d5; color: #8a5a00; }
        .badge.safe, .badge.published { background: #def7e5; color: #1b6b3a; }
        .badge.rejected { background: #e9e9e9; color: #555555; }
        .badge.overridden { background: #eee5ff; color: #5b2a9e; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0.9rem; }
        .card { background: #ffffff; border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.9rem 1rem; }
        .card .value { font-size: 1.7rem; font-weight: 700; }
        .card p { margin: 0.25rem 0 0; font-size: 0.85rem; color: var(--muted); }
        .panel { background: #ffffff; border: 1px solid var(--line); border-radius: 0.5rem; padding: 1rem; margin-top: 1rem; }
        .panel h3 { margin: 0 0 0.5rem; font-size: 1rem; }
        form.inline { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-end; }
        label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem; color: #444444; }
        input, select, textarea, button { font: inherit; }
        input, select, textarea { padding: 0.4rem 0.5rem; border: 1px solid #cfcfcf; border-radius: 0.35rem; background: #ffffff; }
        textarea { width: 100%; font-family: ui-monospace, monospace; font-size: 0.82rem; }
        button { padding: 0.45rem 0.8rem; border: 1px solid var(--link); background: var(--link); color: #ffffff; border-radius: 0.35rem; cursor: pointer; }
        button.secondary { background: #ffffff; color: var(--link); }
        .error { color: #9b1c1c; background: #fde2e1; border: 1px solid #f5c2c0; padding: 0.5rem 0.75rem; border-radius: 0.35rem; }
        .stack { display: grid; gap: 0.6rem; }
        ul.plain { margin: 0.25rem 0; padding-left: 1.1rem; }
        ul.plain li { margin: 0.2rem 0; }
        details summary { cursor: pointer; color: var(--link); }
        .sep { margin-top: 0.5rem; border-top: 1px solid #eeeeee; padding-top: 0.5rem; }
    </style>
</head>
<body>
    <nav>
        <a class="brand" href="/">Contract Guard</a>
        <a href="/">Services</a>
        <a href="/consumers">Consumers</a>
        <a href="/metrics">Metrics</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
