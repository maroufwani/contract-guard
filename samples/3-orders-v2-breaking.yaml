openapi: 3.0.3
info:
  title: Orders API
  version: 2.0.0
  description: 'Breaking: qty removed from the response, couponCode now required, new CANCELLED status. Should be blocked.'
paths:
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetails'
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetails'
        '404':
          description: Not found
components:
  schemas:
    OrderRequest:
      type: object
      required:
      - customerId
      - items
      - couponCode
      properties:
        customerId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestLine'
        note:
          type: string
        couponCode:
          type: string
    RequestLine:
      type: object
      required:
      - sku
      - qty
      properties:
        sku:
          type: string
        qty:
          type: integer
    OrderDetails:
      type: object
      required:
      - orderId
      - status
      - total
      - items
      properties:
        orderId:
          type: string
        status:
          type: string
          enum:
          - NEW
          - PAID
          - CANCELLED
        total:
          type: number
        currency:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResponseLine'
    ResponseLine:
      type: object
      required:
      - sku
      properties:
        sku:
          type: string
